services:
  api:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    environment:
      DATABASE_URL: sqlite:////dados/prato_cheio.db
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:0.5b
    volumes: ["dados:/dados"]
    depends_on: [ollama]
  ollama:
    image: ollama/ollama:latest
    volumes: ["modelos:/root/.ollama"]
  ollama-init:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on: [ollama]
    entrypoint: ["/bin/sh", "-c"]
    command: ["until ollama list; do sleep 2; done; ollama pull qwen2.5:0.5b"]
volumes:
  dados:
  modelos:
